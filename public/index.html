<title>Регистрации участников</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1b1f27; --muted: #667085; --line: #e4e7ec;
    --paid: #1f9d63; --unpaid: #d9534f; --accent: #2f5bea; --bar: #e8ecf8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #eef0f4; --muted: #9aa3b2; --line: #2d333d; --paid: #3ecf8e; --unpaid: #ff7a73; --accent: #7b9bff; --bar: #2a3350; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .btn { font: inherit; font-size: 14px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  .kpi .l { color: var(--muted); font-size: 15px; }
  .kpi .v { display: block; font-size: clamp(44px, 9vw, 72px); font-weight: 700; line-height: 1.05; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi.paid .v { color: var(--paid); }
  .kpi.unpaid .v { color: var(--unpaid); }
  .kpi .s { color: var(--muted); font-size: 14px; }

  .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; overflow-x: auto; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  th { font-size: 13px; font-weight: 600; color: var(--muted); }
  tbody tr:last-child td { border-bottom: 0; }
  tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; }
  td.paid { color: var(--paid); } td.unpaid { color: var(--unpaid); }
  .pct { position: relative; min-width: 76px; }
  .pct i { position: absolute; inset: 6px 0 6px auto; background: var(--bar); border-radius: 4px; z-index: 0; }
  .pct span { position: relative; z-index: 1; padding: 0 6px; }
  .msg { margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; font-size: 14px; background: var(--card); border: 1px solid var(--line); }
  .msg.err { border-color: var(--unpaid); color: var(--unpaid); }
  .msg.warn { border-color: #d9a400; background: color-mix(in srgb, #d9a400 12%, var(--card)); }
  .msg b { display: block; margin-bottom: 4px; }
  .msg ul { margin: 0; padding-left: 20px; }

  @media (max-width: 760px) { .kpis, .tables { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Регистрации участников</h1>
      <div class="sub" id="src">registrations.csv</div>
    </div>
    <div>
      <label class="btn" for="file">Загрузить другой CSV</label>
      <input id="file" type="file" accept=".csv,text/csv,text/plain" hidden>
    </div>
  </header>

  <div id="msgs" aria-live="polite"></div>

  <section class="kpis" aria-label="Итоги">
    <div class="kpi"><span class="l">Всего регистраций</span><span class="v" id="k-total">–</span><span class="s">&nbsp;</span></div>
    <div class="kpi paid"><span class="l">Оплатили</span><span class="v" id="k-paid">–</span><span class="s" id="k-paid-s">&nbsp;</span></div>
    <div class="kpi unpaid"><span class="l">Не оплатили</span><span class="v" id="k-unpaid">–</span><span class="s" id="k-unpaid-s">&nbsp;</span></div>
  </section>

  <section class="tables">
    <div class="card"><h2>По каналам (откуда пришли)</h2><table id="t-source"></table></div>
    <div class="card"><h2>По городам</h2><table id="t-city"></table></div>
  </section>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const YES = new Set(['да', 'yes', 'true', '1', 'y', 'оплачено', 'оплатил', 'оплатила']);
const NO = new Set(['нет', 'no', 'false', '0', 'n', 'не оплачено', 'не оплатил', 'не оплатила']);
const TOTAL_RE = /^(итого|всего|total)$/i;
const ISO = /^\d{4}-\d{2}-\d{2}$/;

/* ---------- чтение файла: кодировка ---------- */
function decode(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return { text: new TextDecoder('utf-16le').decode(b), enc: 'UTF-16' };
  if (b[0] === 0xFE && b[1] === 0xFF) return { text: new TextDecoder('utf-16be').decode(b), enc: 'UTF-16' };
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(b), enc: 'UTF-8' }; }
  catch { return { text: new TextDecoder('windows-1251').decode(b), enc: 'Windows-1251' }; }
}

/* ---------- разбор CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some((x) => x.trim())) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some((x) => x.trim())) rows.push(row);
  return rows;
}

const norm = (s) => s.toLowerCase().replace(/\s+/g, ' ').trim();
const sample = (arr, n = 4) => arr.slice(0, n).join(', ') + (arr.length > n ? ' и ещё ' + (arr.length - n) : '');

function toRecords(text) {
  const t = parseCSV(text);
  if (t.length < 2) throw new Error('В файле нет строк с данными.');
  const head = t[0].map((h) => h.trim().toLowerCase());
  const miss = ['city', 'source', 'paid'].filter((c) => !head.includes(c));
  if (miss.length) throw new Error('Не найдены столбцы: ' + miss.join(', ') + '. Нужны минимум: city, source, paid.');
  const ix = (c) => head.indexOf(c);
  const col = { city: ix('city'), source: ix('source'), paid: ix('paid'), name: ix('name'), reg: ix('registered') };
  const cell = (r, c) => (c < 0 ? '' : (r[c] || '').trim());

  const rows = [], warns = [];
  let skipped = 0, emptyCity = 0, emptySource = 0, last = '';
  const unknown = new Map(), seen = new Map(), dups = new Set();

  for (const r of t.slice(1)) {
    const city = cell(r, col.city), source = cell(r, col.source), name = cell(r, col.name);
    if ([city, source, name].some((v) => TOTAL_RE.test(v))) { skipped++; continue; }
    const raw = cell(r, col.paid), p = raw.toLowerCase();
    let paid = false;
    if (YES.has(p)) paid = true;
    else if (!NO.has(p)) unknown.set(raw || '(пусто)', (unknown.get(raw || '(пусто)') || 0) + 1);
    if (!city) emptyCity++;
    if (!source) emptySource++;
    const reg = cell(r, col.reg);
    if (ISO.test(reg) && reg > last) last = reg;
    if (name) {
      const k = norm(name) + '|' + norm(city);
      if (seen.has(k)) dups.add(name); else seen.set(k, 1);
    }
    rows.push({ city: city || '(не указан)', source: source || '(не указан)', paid });
  }

  if (skipped) warns.push(`Пропущено строк «Итого/Всего»: ${skipped} — они не считаются регистрациями.`);
  if (unknown.size) {
    const n = [...unknown.values()].reduce((a, b) => a + b, 0);
    warns.push(`В столбце paid не распознано значений: ${n} (${sample([...unknown.keys()].map((k) => '«' + k + '»'))}). Они посчитаны как «не оплатили». Распознаются «да» и «нет».`);
  }
  if (emptyCity) warns.push(`Строк без города: ${emptyCity} (показаны как «(не указан)»).`);
  if (emptySource) warns.push(`Строк без канала: ${emptySource} (показаны как «(не указан)»).`);
  for (const [key, label] of [['city', 'городов'], ['source', 'каналов']]) {
    const g = new Map();
    rows.forEach((r) => { const k = norm(r[key]); (g.get(k) || g.set(k, new Set()).get(k)).add(r[key]); });
    const similar = [...g.values()].filter((s) => s.size > 1).map((s) => [...s].join(' / '));
    if (similar.length) warns.push(`Похожие написания ${label}: ${similar.join('; ')}. Они посчитаны отдельными строками.`);
  }
  if (dups.size) warns.push(`Повторяются участники (имя и город): ${sample([...dups])}. Каждая строка посчитана как отдельная регистрация.`);
  return { rows, warns, last };
}

/* ---------- расчёт и вывод ---------- */
function group(rows, key) {
  const m = new Map();
  for (const r of rows) {
    const o = m.get(r[key]) || { k: r[key], n: 0, paid: 0 };
    o.n++; if (r.paid) o.paid++;
    m.set(o.k, o);
  }
  return [...m.values()].sort((a, b) => b.n - a.n || a.k.localeCompare(b.k, 'ru'));
}

const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
const fmtDate = (d) => d.slice(8) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4);
function td(text, cls) { const e = document.createElement('td'); e.textContent = text; if (cls) e.className = cls; return e; }

function fillTable(tbl, label, list, total) {
  tbl.replaceChildren();
  const thead = tbl.createTHead().insertRow();
  [label, 'Всего', 'Оплатили', 'Не оплатили', '% оплаты'].forEach((h) => { const th = document.createElement('th'); th.textContent = h; thead.append(th); });
  const tb = tbl.createTBody();
  for (const d of list) {
    const tr = tb.insertRow();
    const p = pct(d.paid, d.n);
    const cell = td('', 'pct');
    const bar = document.createElement('i'); bar.style.width = p + '%';
    const span = document.createElement('span'); span.textContent = p + '%';
    cell.append(bar, span);
    tr.append(td(d.k), td(d.n), td(d.paid, 'paid'), td(d.n - d.paid, 'unpaid'), cell);
  }
  const tr = tbl.createTFoot().insertRow();
  tr.append(td('Итого'), td(total.n), td(total.paid, 'paid'), td(total.n - total.paid, 'unpaid'), td(pct(total.paid, total.n) + '%'));
}

function render(rows) {
  const n = rows.length, paid = rows.filter((r) => r.paid).length;
  $('k-total').textContent = n;
  $('k-paid').textContent = paid;
  $('k-unpaid').textContent = n - paid;
  $('k-paid-s').textContent = pct(paid, n) + '% от всех';
  $('k-unpaid-s').textContent = pct(n - paid, n) + '% от всех';
  const total = { n, paid };
  fillTable($('t-source'), 'Канал', group(rows, 'source'), total);
  fillTable($('t-city'), 'Город', group(rows, 'city'), total);
}

function showMsgs(items) { // items: [{cls, title, lines[]}]
  $('msgs').replaceChildren(...items.map(({ cls, title, lines }) => {
    const box = document.createElement('div'); box.className = 'msg ' + cls;
    if (title) { const b = document.createElement('b'); b.textContent = title; box.append(b); }
    if (lines.length === 1 && !title) box.textContent = lines[0];
    else { const ul = document.createElement('ul'); lines.forEach((l) => { const li = document.createElement('li'); li.textContent = l; ul.append(li); }); box.append(ul); }
    return box;
  }));
}

function load(text, label, enc, embedded) {
  try {
    const { rows, warns, last } = toRecords(text);
    render(rows);
    const parts = [label, 'строк: ' + rows.length];
    if (last) parts.push('последняя регистрация ' + fmtDate(last));
    if (embedded) parts.push('данные вшиты в страницу и сами не обновляются');
    $('src').textContent = parts.join(' · ');
    const msgs = [];
    if (enc && enc !== 'UTF-8') msgs.push({ cls: '', lines: ['Файл не в UTF-8, прочитан как ' + enc + '.'] });
    if (warns.length) msgs.push({ cls: 'warn', title: 'Проверьте данные:', lines: warns });
    showMsgs(msgs);
  } catch (e) {
    showMsgs([{ cls: 'err', lines: ['Не удалось загрузить файл. ' + e.message + ' Ниже остались прежние данные.'] }]);
  }
}

$('file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const { text, enc } = decode(rd.result); load(text, f.name, enc, false); };
  rd.onerror = () => showMsgs([{ cls: 'err', lines: ['Не удалось прочитать файл.'] }]);
  rd.readAsArrayBuffer(f);
  e.target.value = '';
});

load($('csv').textContent, 'registrations.csv', 'UTF-8', true);
</script>
